<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>2024 Election XML</title>
  <style>
    body {
      font-family: monospace;
      white-space: pre-wrap;
      margin: 20px;
    }
  </style>
</head>
<body>
<pre id="out">Loading...</pre>

<script>
fetch("2024.xml")
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.text();
  })
  .then(xml => {
    document.getElementById("out").textContent = xml;
  })
  .catch(err => {
    document.getElementById("out").textContent = "Error: " + err;
  });
</script>
</body>
</html>
